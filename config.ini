[paths]
llama_server = llama-vulkan/llama-server.exe
llama_cli = llama-vulkan/llama-cli.exe
model = models/qwen25-coder-3b-q4km.gguf
rag_dir = rag/active
input_task = input/current_task.txt
output_dir = output
steps_dir = output/steps
final_project_dir = output/final_project
logs_dir = output/logs

[server]
host = 127.0.0.1
port = 8080
endpoint = http://127.0.0.1:8080/completion
health_endpoint = http://127.0.0.1:8080/health
request_timeout_seconds = 300

[llama]
ctx_size = 6144
threads = 8
gpu_layers = 20
no_mmap = true
no_kv_offload = false
flash_attn = false
temperature = 0.05
top_p = 0.85
repeat_penalty = 1.05
max_tokens = 2048
max_runtime_seconds = 300
no_warmup = false

[rag]
top_k = 5
chunk_chars = 1200
overlap_chars = 150
always_include_rules = true

[steps]
step_01_max_tokens = 1200
step_02_max_tokens = 2048
step_03_max_tokens = 2048
max_repair_attempts = 2
